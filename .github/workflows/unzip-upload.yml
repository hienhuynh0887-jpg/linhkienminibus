name: Unpack uploaded zip

on:
  workflow_dispatch:
  push:
    paths:
      - "linhkienminibus-main.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip into repo root
        id: unpack
        run: |
          if [ ! -f linhkienminibus-main.zip ]; then
            echo "No zip found, nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf /tmp/unz && mkdir /tmp/unz
          unzip -q linhkienminibus-main.zip -d /tmp/unz
          SRC=$(find /tmp/unz -mindepth 1 -maxdepth 1 -type d | head -n 1)
          cp -a "$SRC"/. .
          rm -f linhkienminibus-main.zip
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.unpack.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload project from zip" || echo "Nothing to commit"
          git push
