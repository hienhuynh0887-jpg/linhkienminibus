<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Kim Long Motor</title>
    <meta name="description" content="Ứng dụng quản lý sản xuất Kim Long Motor" />

    <!-- ── PWA / TWA: Manifest + Icon ── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c81e1e" />
    <meta name="background-color" content="#ffffff" />

    <!-- Icon hiển thị trên tab trình duyệt -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Icon khi lưu ra màn hình chính trên iOS -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kim Long Motor" />

    <!-- Android: cho phép hiển thị full-screen dạng app khi mở từ màn hình chính -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>

    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
